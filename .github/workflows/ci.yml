name: CI

# M6 质量验收（标准 10）：CI 全绿 = ruff + mypy + pytest（覆盖率双门） + 依赖扫描。
# 覆盖率门：总 ≥70%、核心（forges/review/worker/queue/storage）≥83%
# （阈值按实测校正，见 M6-4；核心被 agentic 大模型管线拉低，M6 不补 agentic 单测）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 同步依赖
        run: uv sync
      - name: ruff check
        run: uv run ruff check src tests

  type:
    name: type（mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 同步依赖
        run: uv sync
      - name: mypy
        run: uv run mypy src

  test:
    name: test（pytest + 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 同步依赖
        run: uv sync
      - name: 总覆盖率门（≥70%）
        run: uv run pytest tests --cov=codereview_ai --cov-report=term-missing --cov-fail-under=70
      - name: 核心模块覆盖率门（≥83%）
        run: |
          uv run pytest tests \
            --cov=codereview_ai.forges --cov=codereview_ai.review \
            --cov=codereview_ai.worker --cov=codereview_ai.queue \
            --cov=codereview_ai.storage --cov-report=term --cov-fail-under=83

  deps:
    name: deps（pip-audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 同步依赖
        run: uv sync
      - name: 依赖漏洞扫描
        run: uv run pip-audit