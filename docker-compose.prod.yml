# 生产部署（阿里云 ECS）：镜像由 GitHub Actions 构建并推送到阿里云 ACR，
# 服务器只做 docker pull + up 的取像与重启，机上不编译
# （ECS 为 2C2G、swap 常满，机上跑 uv sync + semgrep 安装必 OOM）。
#
# 使用（服务器上）：
#   cd /opt/codereview-ai
#   docker compose -f docker-compose.prod.yml up -d        # 需同目录 .env
#   docker compose -f docker-compose.prod.yml logs -f      # 看日志
#
# 前置：同目录 .env 至少含 4 枚必配密钥（CR_SECRET_KEY / CR_WEBHOOK_SECRET /
# CR_ENCRYPTION_KEY / CR_ADMIN_PASSWORD），缺失时容器启动即 fail-fast 退出。
# 密钥只在服务器上，不入库；模型与平台凭据可在后台「模型/平台」页配置（落 DB）。

services:
  codereview-ai:
    # CI 在服务器上把 ACR 镜像 tag 成本地名（见 .github/workflows/deploy-aliyun.yml），
    # compose 因此不感知 registry，仓库里的定义也不含任何密钥。
    image: codereview-ai:latest
    container_name: codereview-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # 同机 80 已被 nginx、8080 已被另一业务容器占用，本服务用 5001（需在安全组放行）
      - "5001:5001"
    volumes:
      # SQLite 落在命名卷，重建容器不丢数据（切 PG 见 docs/how_use_postgres.md）
      - appdb:/app/data
    logging:
      # 默认 json-file 无上限，审查日志量大时会把 40G 盘写满；限 3×10MB 轮转
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # 同机还有 MySQL/Redis/nginx 与另一个业务容器，给本容器设上限防它吃光 2G 内存。
          # 本服务常态约 200~300M；开静态分析（semgrep）时子进程会额外占用数百 M。
          memory: 1G

volumes:
  appdb:
