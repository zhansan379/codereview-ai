# codereview-ai Composer（M6 标准 9）。
# 密钥从宿主 .env 注入（.gitignore 已忽略 .env）；缺密钥容器启动即 fail-fast。
# 使用：docker compose up -d；健康探测 http://localhost:5001/health。
#
# —— PostgreSQL（可选，standard 档）——
# 默认 ONLY 起 app + SQLite（simple 档，行为与旧版一致）。要切 PG：
#   1) .env 里设 CR_DB_USER / CR_DB_PASSWORD（缺密码直接报错提示）
#   2) docker compose --profile postgres up -d
#   3) 通过 CR_DATABASE_URL 让 app 连 PG：
#      CR_DATABASE_URL=postgresql+asyncpg://${CR_DB_USER}:${CR_DB_PASSWORD}@postgres:5432/codereview
# 首次空卷时 postgres 用 POSTGRES_DB 自动建库；app 端 CREATE TABLE 建表。

services:
  codereview-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: codereview-ai:v0.1.0
    container_name: codereview-ai
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # 四枚必配密钥（无默认值，缺失即拒绝启动，见 DESIGN §16）
      CR_SECRET_KEY: "${CR_SECRET_KEY:?请设置 CR_SECRET_KEY（生成: python -c 'import secrets;print(secrets.token_urlsafe(48))'）}"
      CR_WEBHOOK_SECRET: "${CR_WEBHOOK_SECRET:?请设置 CR_WEBHOOK_SECRET}"
      CR_ENCRYPTION_KEY: "${CR_ENCRYPTION_KEY:?请设置 CR_ENCRYPTION_KEY（Fernet）}"
      CR_ADMIN_PASSWORD: "${CR_ADMIN_PASSWORD:?请设置 CR_ADMIN_PASSWORD}"
      # 平台 token / 模型（可选；配齐才启动内置 worker）
      CR_LLM_MODEL: ${CR_LLM_MODEL:-}
      CR_GITLAB_URL: ${CR_GITLAB_URL:-}
      CR_GITLAB_TOKEN: ${CR_GITLAB_TOKEN:-}
      CR_GITHUB_URL: ${CR_GITHUB_URL:-}
      CR_GITHUB_TOKEN: ${CR_GITHUB_TOKEN:-}
      # 运行时：默认 SQLite（simple 档）；切 PG 时给 .env 设 CR_DATABASE_URL 指向 postgres
      CR_DATABASE_URL: ${CR_DATABASE_URL:-sqlite:////app/data/app.db}
    volumes:
      - appdb:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # 可选 PostgreSQL（standard 档）。profile 隔离：默认 `docker compose up` 不启动它。
  # 启用：docker compose --profile postgres up -d（详见顶部注释）。
  postgres:
    image: postgres:16
    profiles: ["postgres"]
    container_name: codereview-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: codereview            # 空卷首次初始化自动 CREATE DATABASE
      POSTGRES_USER: ${CR_DB_USER:-codereview}
      POSTGRES_PASSWORD: ${CR_DB_PASSWORD:?请在 .env 设置 CR_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CR_DB_USER:-codereview} -d codereview"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  appdb:
  pgdata: