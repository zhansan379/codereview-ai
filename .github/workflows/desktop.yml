name: Desktop

# 桌面单机版（Windows exe）：前端产物 + PyInstaller onedir → zip 挂 GitHub Release。
# 包体积大（litellm 动态 import 全收），仅 tag 与手动触发时构建，main 推送不出包。
# 产物：codereview-ai-windows-x64.zip，解压双击 codereview-ai.exe（用法见 docs/how_use_desktop.md）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # softprops/action-gh-release 挂产物到 Release 需要

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build（Windows exe）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端（dist 不进 git，打包需要）
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v5

      - name: 打包 exe（desktop.spec，onedir）
        run: |
          uv sync --group desktop
          uv run pyinstaller --noconfirm desktop.spec

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path dist/codereview-ai/* -DestinationPath codereview-ai-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: codereview-ai-windows-x64
          path: codereview-ai-windows-x64.zip

      - name: 挂到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: codereview-ai-windows-x64.zip
